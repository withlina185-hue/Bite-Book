        <form>
            <h1 style="font-size:50px;text-align:center;margin-top:40px;">Sign Up</h1>

            <label for="username" style="font-size:24px;margin-left:80px;">First Name:</label>

            <input type="text" id="username" name="fname" style="width:50%;height:40px;margin-left:20px;margin-top:10px;border-radius:10px;border:1px solid #36332d;background-color:#FAF8F3;font-family:Roboto Slab;font-size:16px;padding-left:10px;">

            <br><br>

            <label for="password" style="font-size:24px;margin-left:80px;">Last Name:</label>

            <input type="text" id="password" name="lname" style="width:50%;height:40px;margin-left:20px;margin-top:10px;border-radius:10px;border:1px solid #36332d;background-color:#FAF8F3;font-family:Roboto Slab;font-size:16px;padding-left:10px;">

            <br><br>
            <label for="username" style="font-size:24px;margin-left:80px;">Email:</label>
            <input type="email" id="username" name="email" style="width:50%;height:40px;margin-left:70px;margin-top:10px;border-radius:10px;border:1px solid #36332d;background-color:#FAF8F3;font-family:Roboto Slab;font-size:16px;padding-left:10px;">
            <br><br>
            <label for="password" style="font-size:24px;margin-left:80px;">Password:</label>
            <input type="password" id="password" name="password" style="width:50%;height:40px;margin-left:30px;margin-top:10px;border-radius:10px;border:1px solid #36332d;background-color:#FAF8F3;font-family:Roboto Slab;font-size:16px;padding-left:10px;"> 
            

            <button type="submit" style="margin-left:250px;margin-top:30px;border-radius:20px;background-color:#59634A;color:#e5e0d7;font-family:Roboto Slab;font-size:20px;font-weight:bold;padding:10px 20px;width:120px;">Sign Up</button>

            <h3 style="font-size:16px;margin-left:200px;">Already have an account? <a href="login.html" style="color:#59634A;">Login</a></h3>
